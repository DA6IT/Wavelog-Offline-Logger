name: Fehlerbericht
description: Reproduzierbaren Programmfehler melden
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Danke für den Bericht. Keine API-Tokens oder vollständigen privaten Logs einfügen. Sicherheitsprobleme bitte gemäß SECURITY.md privat melden.
  - type: input
    id: version
    attributes:
      label: Programmversion
      placeholder: z. B. 0.11.2-rc1
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Betriebssystem
      placeholder: z. B. Windows 11 24H2
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Schritte zum Reproduzieren
      description: Bitte so genau wie möglich und mit anonymisierten Daten.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Erwartetes Verhalten
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Tatsächliches Verhalten und Fehlermeldung
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Datenschutz
      options:
        - label: Ich habe Tokens, private Stationsdaten und persönliche Logeinträge entfernt.
          required: true
