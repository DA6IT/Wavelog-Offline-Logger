name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows-release:
    name: Build and publish Windows release
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12.10'

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.23.2'
          cache: false

      - name: Test and package
        shell: pwsh
        run: .\scripts\package-release.ps1 -OutputDirectory dist

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ github.ref_name }}'
          $assets = Get-ChildItem -LiteralPath dist -File | Where-Object {
            $_.Extension -in '.exe', '.zip' -or $_.Name -eq 'SHA256SUMS.txt'
          }
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $assets.FullName --clobber
            exit $LASTEXITCODE
          }
          $arguments = @(
            'release', 'create', $tag,
            '--title', "DA6IT.de Wavelog Offline Logger $tag",
            '--generate-notes'
          )
          if ($tag.Contains('-')) {
            $arguments += '--prerelease'
          }
          $arguments += $assets.FullName
          gh @arguments

  macos-release:
    name: Build and publish macOS ${{ matrix.package_arch }} release
    needs: windows-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            python_arch: arm64
            package_arch: arm64
          - runner: macos-15-intel
            python_arch: x64
            package_arch: x64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12.10'
          architecture: ${{ matrix.python_arch }}

      - name: Test and build app bundle
        shell: bash
        run: ./scripts/build-macos.sh dist

      - name: Publish macOS release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag='${{ github.ref_name }}'
          gh release upload "${tag}" dist/*.zip dist/*.sha256 --clobber
